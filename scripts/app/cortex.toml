# CortexTerm's configuration inside the app bundle (`Contents/Resources/cortex.toml`), read by the
# frame (`Contents/MacOS/CortexTerm`). The same file runs the macOS app and the development start
# (`./cortexterm` builds the same app into build/). Relative paths resolve against this file, and the
# plugins run with this folder as their working directory.
#
# Schema (the frame rejects unknown keys):
#   [frame]
#   home = "~/.cortexterm"   # CORTEX_HOME unless the env var overrides it
#   port = 0                 # 0 = pick a free port (written to <home>/run/frame.json)
#   ui = true                # spawn the Electron shell after plugins are active
#   ui_dir = "ui"            # the Electron shell, renderer and Electron itself
#   packages = "packages"    # the app's prebuilt plugins (<id>@<version>.ccplugin), installed at start
#   live = "~/.cortexterm/live"  # the live folder: plugin data (default <home>/live; `--safe` ignores it)
#
#   [plugin.<id>]            # optional overrides of what plugin <id>'s package declares
#   args = []
#   hello_timeout_ms = 60000
#   probe_timeout_ms = 120000
#   [plugin.<id>.config]     # merged over the package's [backend.config]

[frame]
home = "~/.cortexterm"
port = 0
ui = true
ui_dir = "ui"
packages = "packages"
