# CortexTerm plugin manifest (plugin.toml, schema ccplugin/1). One folder is one plugin: its backend,
# UI packages, shell modules, verification and README together, separable into its own repository
# (only cc-protocol and @cortex/sdk come from outside). `cortex-pack` builds the folder and packs it
# into a portable .ccplugin; the frame runs it only as an installed package.
# Paths are relative to this folder.

[plugin]
id = "terminal"
name = "Terminal"
version = "0.2.6"
description = "PTY terminals running the user's login shell, kept alive by the cortexd daemon across app restarts and plugin swaps, with output events, resize, VT-parsed screen snapshots, Runs and learned habits; the Terminal tab of the right pane."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame (its own Cargo workspace).
[backend]
category = "terminal"
contract = "terminal@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-terminal"
# The PTY daemon that owns the shells; the plugin starts it from beside its own executable.
assets = ["backend/target/release/cortexd"]

# UI packages: one npm workspace rooted at ui/ (own package-lock.json); each package builds
# <dir>/dist with manifest.json {id, version, slot, entry, css}, which the frame serves.
[ui]
dir = "ui"
build = ["npm", "run", "build"]

[[ui.package]]
dir = "ui/pane"
id = "terminal.pane"
slot = "pane.terminal@1"

# The shell integration scripts (data/shell: zsh, bash, fish), packed at the same path; the
# backend reads them from the live folder (<home>/live/plugins/terminal/data) when present.
[data]
dirs = ["data"]
