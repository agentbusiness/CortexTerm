# CortexTerm plugin manifest (plugin.toml, schema ccplugin/1).

[plugin]
id = "chatflow-terminal"
name = "Terminal flow"
version = "0.1.24"
description = "Terminal assistance with compact task-skill selection, bounded read-only checks, configuration previews and user-run proposals, with graph-backed learning and recall."
license = "UNLICENSED"
platforms = ["macos", "linux"]

[backend]
category = "chatflow-terminal"
contract = "chatflow@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-chatflow-terminal"

# The prompts are live data: edited in place in the live folder while the app runs.
[data]
dirs = ["data"]
