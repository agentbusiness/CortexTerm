# CortexTerm plugin manifest (plugin.toml, schema ccplugin/1). Paths are relative to this folder.

[plugin]
id = "model-llama"
name = "Model (Gemma on llama.cpp)"
version = "0.1.7"
description = "Gemma 4 (tag office) on upstream llama.cpp's llama-server with MTP drafts, on Metal on macOS and on the CPU on Linux: E4B above 8 GB, E2B on 8 GB machines. One model per machine: while another app on this machine (CortexCode) offers a model through the mesh, calls are borrowed from it and Gemma stays unloaded; an app about to load another kind of model asks Gemma to yield (model.yield)."
license = "UNLICENSED"
platforms = ["macos", "linux"]

# The logic plugin: a supervised process speaking CPP/1 to the frame. It supervises one llama-server
# child (built from the vendored llama.cpp by build.sh, shipped in llama/ beside the executable with
# its GPU backends) on loopback.
[backend]
category = "model"
contract = "model@1"
dir = "backend"
build = ["sh", "build.sh"]
exec = "backend/target/release/cc-model-llama"
assets = ["backend/target/release/llama"]
swap = "drain_first"
hello_timeout_ms = 60000
# A first start may download the model (2.6 or 4.2 GB) before the probe's generation check.
probe_timeout_ms = 600000
provides = [
  "model.info", "model.chat", "model.complete", "model.tokenize", "model.count", "model.slots",
  "model.hibernate", "model.hold", "model.prewarm", "model.variants", "model.select", "model.yield",
]
publishes = ["model.progress", "model.install"]

# Defaults for the frame config's [plugin.config] table (the frame config's values win).
[backend.config]
variant = ""            # "" = by memory: gemma-4-e4b-qat above 8 GiB, gemma-4-e2b-qat otherwise
ctx = 8192              # context tokens per slot
parallel = 2            # llama-server slots (the pool is ctx * parallel)
ubatch = 256
kv_type = "f16"         # "q8_0" only where flash attention works (checked once, falls back to f16)
idle_unload_s = 600     # unload Gemma after this long without a request
borrow = true           # borrow another app's model on this Mac (through the mesh) instead of loading Gemma
