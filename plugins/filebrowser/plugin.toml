[plugin]
id = "filebrowser"
name = "File Browser"
version = "0.1.1"
description = "Home-rooted file browsing and native file transfers for mesh computers."
license = "UNLICENSED"
platforms = ["macos", "linux"]

[backend]
category = "filebrowser"
contract = "filebrowser@1"
dir = "backend"
build = ["cargo", "build", "--release"]
exec = "backend/target/release/cc-filebrowser"
provides = ["filebrowser.list", "filebrowser.read", "filebrowser.upload.start", "filebrowser.upload.write", "filebrowser.upload.finish", "filebrowser.upload.cancel"]

[ui]
dir = "ui"
build = ["npm", "run", "build"]

[[ui.package]]
dir = "ui"
id = "filebrowser.files"
slot = "machine.files@1"

[[shell]]
dir = "shell"
id = "filebrowser.shell-module"
serves = "filebrowser-native"
