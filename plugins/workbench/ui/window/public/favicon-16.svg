<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>CortexTerm favicon, 16 px cut</title>
  <rect width="16" height="16" fill="#14171A"/>
  <!-- at 16 px the cursor keeps a 1 px gap so it does not merge with the underscore -->
  <path d="M3.5 4 6 8 3.5 12" fill="none" stroke="#E9EBEC" stroke-width="1.4" stroke-linecap="square" shape-rendering="geometricPrecision"/>
  <rect x="7" y="11" width="6" height="2" fill="#E9EBEC"/>
  <rect x="11" y="8" width="2" height="2" fill="#E2603F"/>
</svg>
