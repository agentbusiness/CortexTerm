[package]
name = "cc-cleanup"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false
description = "CortexTerm cleanup@1 plugin: disk space this computer can get back, with the person's and the local model's decisions in the graph."

# Own workspace: every plugin directory builds independently.
[workspace]

[[bin]]
name = "cc-cleanup"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["cleanup", "memory", "model"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"
rayon = "1.12"
blake3 = "1.8"
libc = "0.2"
sysinfo = "0.37"
plist = "1"
uuid = { version = "1.23", features = ["v4"] }
