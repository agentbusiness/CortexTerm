[package]
name = "cc-system"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false
description = "CortexTerm system@1 plugin: machine metrics, processes and ports, process signals, watchers and the security sweep."

# Own workspace: every plugin directory builds independently.
[workspace]

[[bin]]
name = "cc-system"
path = "src/main.rs"

[dependencies]
cc-protocol = { path = "../../../protocol", features = ["system", "notify", "memory", "terminal", "service"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
sysinfo = "0.37"
libc = "0.2"
regex = "1"
notify-fs = { package = "notify", version = "8" }
plist = "1"
xattr = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
flate2 = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The malware scan: YARA-X runs Apple's XProtect rules and the bundled ones; SQLite reads the
# quarantine and privacy-permission databases.
yara-x = { version = "1.21", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "hash-module", "macho-module", "math-module", "string-module", "time-module"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
core-foundation = "0.10"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macmon = { version = "0.10", default-features = false }
